    <table>
      <!-- Cabecera de la tabla -->
      <tr>
        <th>Nombre</th>
        <th>Latitud</th>
        <th>Longitud</th>
        <th>Device</th>
        <th></th>
        <th></th>
      </tr>
      <!-- Cuerpo de la tabla -->
      {% for amigo in amigos %}
      <tr>
        <td>{{amigo.name}}</td>
        <td>{{amigo.lati}}</td>
        <td>{{amigo.longi}}</td>
        <td>{{amigo.device or ''}}</td>
        <td><a href="/html/edit_amigo/{{amigo.id}}">Modificar</a></td>
        <td><a href="/html/delete_amigo/{{amigo.id}}">Borrar</a></td>
      </tr>
      {% endfor %}
    </table>
